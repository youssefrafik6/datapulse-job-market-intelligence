x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-datapulse}
    POSTGRES_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-datapulse}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-datapulse}
  volumes:
    - raw:/app/data/raw
    - processed:/app/data/processed
    - results:/app/results

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  pipeline:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python scripts/ingest.py --source zalize
        python scripts/ingest.py --source luke --report results/data_quality_luke.json
        python scripts/validate.py
        python scripts/transform.py
        python scripts/train.py
  api:
    <<: *app
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
  dashboard:
    <<: *app
    depends_on:
      pipeline:
        condition: service_completed_successfully
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8501}:8501"]

volumes:
  postgres:
  raw:
  processed:
  results:
