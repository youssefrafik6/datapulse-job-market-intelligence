[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "1.0.0"
description = "U.S. tech and data job market intelligence"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2,<3", "pyarrow>=19,<25", "pandas>=2.2,<4",
    "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1", "streamlit>=1.44,<2", "plotly>=6,<8",
    "scikit-learn>=1.6,<2", "networkx>=3.4,<4", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1", "dbt-postgres>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
